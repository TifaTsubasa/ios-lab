[package]
name = "rustcore"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rustcore"
# staticlib 给 iOS 链接，rlib 让 `cargo test` 能跑起来。
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
